name: login-image
# Baseproof's Login V2 and issuer images. Both are built and verified before
# promote pushes their exact bytes and names the release. Pull requests run
# the same verification and publish nothing. Charts pins each image by digest.
on:
  push:
    branches: [main]
  pull_request:
# A newer push to a pull request cancels that PR's older run. Every push run is
# its own group, so a publish is never cancelled and never queued behind another.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  release-script:
    # release.sh against a fake registry: no network, no credentials.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/test_release.sh
      - run: ruby .github/scripts/test_image_workflow.rb
      - run: python3 .github/scripts/check_login_client_secrets.py --self-test

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The base path is baked into the build (next.config.mjs reads it and
      # has no default); set for the whole job so every build Nx runs, the
      # one test-unit depends on included, is the same build.
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      # nx.json names upstream's Nx Cloud workspace: never read or write it.
      NX_NO_CLOUD: "true"
      # Deliberately synthetic values: prove private server configuration does
      # not enter public build artifacts. No real credential is used in CI.
      TURNSTILE_ENABLED: "false"
      TURNSTILE_SITE_KEY: ci-build-public-site-key
      TURNSTILE_SECRET_KEY: ci-build-turnstile-private-sentinel
      TURNSTILE_APPEARANCE: interaction-only
      TURNSTILE_ALLOWED_HOSTNAMES: id.example.com
      ZITADEL_SERVICE_USER_TOKEN: ci-build-service-pat-private-sentinel
      ZITADEL_SESSION_COOKIE_SECRET: ci-build-session-cookie-private-sentinel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: pnpm, the version package.json's packageManager names
        run: corepack enable
      # Nx discovers the whole workspace, including the console project.
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @zitadel/login:lint
      - run: pnpm nx run @zitadel/login:test-unit
      - run: pnpm nx run @zitadel/login:test-dockerized --skip-nx-cache
      - run: pnpm nx run @zitadel/login:build --skip-nx-cache
        env:
          TURNSTILE_ENABLED: "true"
      - name: Check public build artifacts for private configuration
        run: |
          python3 .github/scripts/check_login_client_secrets.py apps/login/.next
          asset="$(find apps/login/.next/static -type f -name '*.js' -print -quit)"
          test -n "$asset"
          echo "LOGIN_STATIC_SMOKE_PATH=/ui/v2/login/_next/static/${asset#apps/login/.next/static/}" >> "$GITHUB_ENV"
      - name: Build the image (linux/amd64, the commit stamped)
        run: docker build --platform linux/amd64 --build-arg SERVICE_REVISION=${{ github.sha }} -t zitadel-login:ci apps/login
      # The login answers /ready only when the Zitadel API's /debug/ready does
      # and a session-cookie secret is set (src/app/ready/route.ts): a
      # stand-in API on the runner answers that one path.
      - name: Smoke the image (starts, ready, carries its commit and version)
        run: |
          mkdir -p /tmp/api/debug && echo ok > /tmp/api/debug/ready
          (cd /tmp/api && python3 -m http.server 18080 >/dev/null 2>&1 &)
          docker run -d --name login-ci --network host \
            -e TURNSTILE_ENABLED=false \
            -e CSP_FETCH_ENABLED=false \
            -e ZITADEL_API_URL=http://127.0.0.1:18080 \
            -e ZITADEL_SERVICE_USER_TOKEN=ci \
            -e ZITADEL_SESSION_COOKIE_SECRET="$(openssl rand -hex 32)" \
            zitadel-login:ci
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://127.0.0.1:3000/ui/v2/login/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/ui/v2/login/healthy
          curl -fsS http://127.0.0.1:3000/ui/v2/login/ready
          curl -fsS -D "${RUNNER_TEMP}/disabled-headers" -o /dev/null "http://127.0.0.1:3000${LOGIN_STATIC_SMOKE_PATH}"
          if grep -i '^content-security-policy:' "${RUNNER_TEMP}/disabled-headers" | grep -q 'https://challenges.cloudflare.com'; then
            echo "Build-time Turnstile configuration overrode runtime disabled configuration" >&2
            exit 1
          fi
          docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' zitadel-login:ci | grep -qx "SERVICE_REVISION=${{ github.sha }}"
          test "$(docker run --rm --entrypoint cat zitadel-login:ci /app/VERSION | tr -d '[:space:]')" = "$(tr -d '[:space:]' < apps/login/VERSION)"
          docker rm -f login-ci
      - name: Check packaged runtime Turnstile configuration
        run: bash .github/scripts/smoke_login_turnstile.sh zitadel-login:ci
      - name: Preserve the verified Login image
        if: github.event_name == 'push'
        run: docker save -o "${RUNNER_TEMP}/login-image.tar" zitadel-login:ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: login-image
          path: ${{ runner.temp }}/login-image.tar
          compression-level: 0
          retention-days: 1

  issuer-image:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NX_NO_CLOUD: "true"
      NX_DAEMON: "false"
      NX_TUI: "false"
      GOOS: linux
      GOARCH: amd64
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
    steps:
      - uses: actions/checkout@v4
        with:
          # golangci-lint's repository configuration compares with origin/main.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: corepack enable
      # API generation builds the console; install the full workspace so the
      # Nx graph and every build dependency are present.
      - run: pnpm install --frozen-lockfile
      - run: pnpm nx run @zitadel/api:build
      - run: go build ./... && go vet ./...
      - run: pnpm nx run @zitadel/api:lint
      - run: pnpm nx run @zitadel/api:test-unit --skip-nx-cache
      # The existing target starts its PostgreSQL/Redis and instrumented API.
      # Its full suite includes login_v2_only_test.go against the running API.
      - run: pnpm nx run @zitadel/api:test-integration --skip-nx-cache
      - name: Stop integration services
        if: always()
        run: pnpm nx run @zitadel/devcontainer:compose -- down --volumes
      - name: Build and stamp the release binary and image
        run: |
          export ZITADEL_VERSION="$(tr -d '[:space:]' < apps/api/VERSION)"
          pnpm nx run @zitadel/api:pack-platform --skip-nx-cache
          docker build --platform linux/amd64 --build-arg TARGETPLATFORM=linux/amd64 \
            --build-arg SERVICE_REVISION="${GITHUB_SHA}" --build-arg SERVICE_VERSION="${ZITADEL_VERSION}" \
            -f apps/api/Dockerfile -t zitadel:ci .
      - name: Smoke the packaged issuer and V2-only routes
        run: bash .github/scripts/smoke_issuer_image.sh zitadel:ci
      - name: Preserve the verified issuer image
        if: github.event_name == 'push'
        run: docker save -o "${RUNNER_TEMP}/issuer-image.tar" zitadel:ci
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: issuer-image
          path: ${{ runner.temp }}/issuer-image.tar
          compression-level: 0
          retention-days: 1

  promote:
    # Both verified images are pushed only after every verification job passed.
    # :sha-<commit> gets :<version> when this push changed its VERSION file
    # (never re-pointed: a version another digest holds
    # fails here, so bump the file) and :latest while the commit is still
    # main's tip. Publishing deploys nothing: baseproof/charts pins the image
    # by digest (make pin, REF=<version> or REF=sha-<commit>).
    if: github.event_name == 'push'
    needs: [release-script, image, issuer-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-image"
          path: ${{ runner.temp }}/verified-images
          merge-multiple: true
      - name: Load the exact verified images
        run: |
          docker load -i "${RUNNER_TEMP}/verified-images/login-image.tar"
          docker load -i "${RUNNER_TEMP}/verified-images/issuer-image.tar"
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.ARTIFACT_REGISTRY_PUSH_KEY }}
      # Tags are written through the registry's Docker API, a manifest copy
      # under the tag (release.sh tag_digest), with the pusher's login.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.ARTIFACT_REGISTRY }}
          username: _json_key
          password: ${{ secrets.ARTIFACT_REGISTRY_PUSH_KEY }}
      - name: Push this commit's verified images
        env:
          IMAGE_BASE: ${{ vars.IMAGE_BASE }}
        run: |
          .github/scripts/release.sh push-verified zitadel-login:ci "${IMAGE_BASE%/}/zitadel-login"
          .github/scripts/release.sh push-verified zitadel:ci "${IMAGE_BASE%/}/zitadel"
      - name: Promote this commit's verified images
        env:
          BEFORE: ${{ github.event.before }}
          IMAGE_BASE: ${{ vars.IMAGE_BASE }}
        run: .github/scripts/release.sh promote "$BEFORE" "${IMAGE_BASE%/}/zitadel-login=apps/login/VERSION" "${IMAGE_BASE%/}/zitadel=apps/api/VERSION"
